{% extends "base.html" %}
{% block title %}Edit {{ article.name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Edit {{ article.name }}</h1>
    <a href="{{ url_for('articles.show', article_id=article.id) }}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card">
    <div class="card-body">
        <form action="{{ url_for('articles.update', article_id=article.id) }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" value="{{ article.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" name="price" min="0" value="{{ article.price }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Stock quantity</label>
                <input type="number" name="stock_quantity" min="0" value="{{ article.stock_quantity }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Categories</label>
                <div class="border rounded p-3">
                    {% for category in categories %}
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" 
                            name="categories_id" 
                            value="{{ category.id }}" 
                            id="category_{{ category.id }}"
                            {% if category in article.categories %}checked{% endif %}>
                        <label class="form-check-label" for="category_{{ category.id }}"> {{ category.name }}</label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>
{% endblock %}
