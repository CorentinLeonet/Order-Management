{% extends "base.html" %}
{% block title %}Edit {{ article.name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Edit {{ article.name }}</h1>
    <a href="{{ url_for('articles.show', article_id=article.id) }}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card">
    <div class="card-body">
        <form action="{{ url_for('article.update', article_id=article.id) }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" value="{{ article.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <textarea name="price" class="form-control" rows="3">{{ article.price }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Stock quantity</label>
                <textarea name="stock_quantity" class="form-control" rows="3">{{ article.stock_quantity }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Categories</label>
                <textarea name="categories" class="form-control" rows="3">{{ article.categories }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>
{% endblock %}
