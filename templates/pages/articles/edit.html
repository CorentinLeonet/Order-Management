{% extends "base.html" %}
{% block title %}Edit {{ article.name }}{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h1 class="mb-0">Edit {{ article.name }}</h1>
        <div class="text-muted small">Update article information</div>
    </div>

    <a href="{{ url_for('articles.show', article_id=article.id) }}"
       class="btn btn-outline-secondary">
        Back
    </a>

</div>

<form action="{{ url_for('articles.update', article_id=article.id) }}"
      method="POST">

    <div class="row g-3">

        <div class="col-12 col-lg-8">

            <div class="card shadow-sm">
                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-12">
                            <label class="form-label text-muted small">Name</label>
                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   value="{{ article.name }}"
                                   required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label text-muted small">Price (€)</label>
                            <input type="number"
                                   name="price"
                                   min="0"
                                   step="0.01"
                                   value="{{ article.price / 100 }}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label text-muted small">VAT (%)</label>
                            <input type="number"
                                   name="vat"
                                   min="0"
                                   max="100"
                                   value="{{ article.vat }}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted small">Stock quantity</label>
                            <input type="number"
                                   name="stock_quantity"
                                   min="0"
                                   value="{{ article.stock_quantity }}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox"
                                       name="active"
                                       id="active"
                                       {% if article.active %}checked{% endif %}>
                                <label class="form-check-label" for="active">
                                    Active
                                </label>
                            </div>
                        </div>

                    </div>

                </div>
            </div>

        </div>

        <div class="col-12 col-lg-4">

            <div class="card shadow-sm">
                <div class="card-body">

                    <div class="text-muted small mb-2">
                        Categories
                    </div>

                    <div class="d-flex flex-column gap-2">

                        {% for category in categories %}
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="categories_id"
                                   value="{{ category.id }}"
                                   id="category_{{ category.id }}"
                                   {% if category in article.categories %}checked{% endif %}>

                            <label class="form-check-label"
                                   for="category_{{ category.id }}">
                                {{ category.name }}
                            </label>
                        </div>
                        {% endfor %}

                    </div>

                </div>
            </div>

        </div>

    </div>

    <div class="mt-4 d-flex gap-2">

        <button type="submit" class="btn btn-primary">
            Save changes
        </button>

    </div>

</form>

{% endblock %}
