{% extends "base.html" %}
{% block title %}New article{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">New article</h1>
    <a href="{{ url_for('articles.index') }}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card">
    <div class="card-body">
        <form action="{{ url_for('articles.create') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control"required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" name="price" min="1" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Stock quantity</label>
                <input type="number" name="stock_quantity" min="1" class="form-control" rows="3">
            </div>
            <div class="mb-3">
                <label class="form-label">Categories</label>
                <div class="border rounded p-3">
                    {% for category in categories %}
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" 
                            name="categories_id" 
                            value="{{ category.id }}" 
                            id="category_{{ category.id }}"
                        >
                        <label class="form-check-label" for="category_{{ category.id }}">{{ category.name }}</label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            {%if error%}
            <div class="mb3">
                <div
                    class="alert alert-primary alert-dismissible fade show"
                    role="alert"
                >
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"
                    ></button>
                    <strong>Error</strong> {{error}}
                </div>
                
                <script>
                    var alertList = document.querySelectorAll(".alert");
                    alertList.forEach(function (alert) {
                        new bootstrap.Alert(alert);
                    });
                </script>
                
            </div>
            {%endif%}
            <button type="submit" class="btn btn-primary">Create</button>
        </form>
    </div>
</div>
{% endblock %}
