{% extends "base.html" %}
{% block title %}New article{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">New article</h1>
    <a href="{{ url_for('articles.index') }}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card">
    <div class="card-body">
        <form action="{{ url_for('articles.create') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control"required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" name="price" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Stock quantity</label>
                <input type="number" name="stock_quantity" class="form-control" rows="3">
            </div>
            <div class="mb-3">
                <label class="form-label">Categories</label>
                <input type="checkbox" name="categories" class="form-control" rows="3">
            </div>
            <button type="submit" class="btn btn-primary">Create</button>
        </form>
    </div>
</div>
{% endblock %}
