{% extends "base.html" %}
{% block title %}New order{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h1 class="mb-0">New order</h1>
        <div class="text-muted small">Create a new order</div>
    </div>

    <a href="{{ url_for('orders.index') }}"
       class="btn btn-outline-secondary">
        Back
    </a>

</div>

<div class="d-flex justify-content-center">

    <form action="{{ url_for('orders.create') }}"
          method="POST"
          class="w-100"
          style="max-width: 700px;">

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="row g-3">

                    <div class="col-12">
                        <label for="client_select" class="form-label text-muted small">
                            Client
                        </label>

                        <select class="form-select form-select-lg"
                                name="client_id"
                                id="client_select"
                                required>

                            {% for client in clients %}
                                <option value="{{ client.id }}">
                                    {{ client.firstname }} {{ client.surname }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                </div>

            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                Create order
            </button>
        </div>

    </form>

</div>

{% endblock %}
