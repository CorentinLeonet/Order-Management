{% extends "base.html" %}
{% block title %}New order{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">New order</h1>
    <a href="{{ url_for('orders.index') }}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card">
    <div class="card-body">
        <form action="{{ url_for('orders.create') }}" method="POST">
            <div class="mb-3">
                
                <label for="client_select" class="form-label">Client</label>
                <select
                    class="form-select form-select-lg"
                    name="client_id"
                    id="client_select"
                >
                    {%for client in clients%}
                    <option value="{{ client.id }}">{{client.firstname}} {{client.surname}}</option>
                    {%endfor%}
                </select>               
            </div>
            <button type="submit" class="btn btn-primary">Create</button>
        </form>
    </div>
</div>
{% endblock %}
