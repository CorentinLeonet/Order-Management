{% extends "base.html" %}
{% block title %}Edit {{ client.firstname }} {{ client.surname }}{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h1 class="mb-0">
            Edit {{ client.firstname }} {{ client.surname }}
        </h1>
        <div class="text-muted small">Update client information</div>
    </div>

    <a href="{{ url_for('clients.show', client_id=client.id) }}"
       class="btn btn-outline-secondary">
        Back
    </a>

</div>

<div class="d-flex justify-content-center">

    <form action="{{ url_for('clients.update', client_id=client.id) }}"
          method="POST"
          class="w-100"
          style="max-width: 700px;">

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="row g-3">

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small">Firstname</label>
                        <input type="text"
                               name="firstname"
                               class="form-control"
                               value="{{ client.firstname }}"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small">Surname</label>
                        <input type="text"
                               name="surname"
                               class="form-control"
                               value="{{ client.surname }}"
                               required>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small">Email</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ client.email }}"
                               required>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="active"
                                   id="active"
                                   {% if client.active %}checked{% endif %}>

                            <label class="form-check-label" for="active">
                                Active
                            </label>
                        </div>
                    </div>

                </div>

            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                Save changes
            </button>
        </div>

    </form>

</div>

{% endblock %}
