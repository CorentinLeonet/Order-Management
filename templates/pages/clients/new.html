{% extends "base.html" %}
{% block title %}New client{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h1 class="mb-0">New client</h1>
        <div class="text-muted small">Create a new client</div>
    </div>

    <a href="{{ url_for('clients.index') }}"
       class="btn btn-outline-secondary">
        Back
    </a>

</div>

<div class="d-flex justify-content-center">

    <form action="{{ url_for('clients.create') }}"
          method="POST"
          class="w-100"
          style="max-width: 700px;">

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="row g-3">

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small">Firstname</label>
                        <input type="text"
                               name="firstname"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small">Surname</label>
                        <input type="text"
                               name="surname"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small">Email</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               required>
                    </div>

                </div>

            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                Create client
            </button>
        </div>

    </form>

</div>

{% endblock %}
