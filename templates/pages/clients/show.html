{% extends "base.html" %}
{% block title %}{{ client.firstname }} {{ client.surname }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">{{ client.firstname }} {{ client.surname }}</h1>
    <a href="{{ url_for('clients.index') }}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card">
    <div class="card-body">
        <p class="text-muted mb-1">email</p>
        <p>{{ category.email}}</p>
    </div>
</div>

<div class="mt-3 d-flex gap-2">
    <a href="{{ url_for('clients.edit', client_id=client.id) }}" class="btn btn-primary">Edit</a>
    <form action="{{ url_for('clients.delete', client_id=client.id) }}" method="POST">
        <button type="submit" class="btn btn-outline-danger"
            onclick="return confirm('Delete {{ client.firstname }} {{ client.surname }}?')">Delete</button>
    </form>
</div>
{% endblock %}
