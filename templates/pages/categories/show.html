{% extends "base.html" %}
{% block title %}{{ category.name }}{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h1 class="mb-0">{{ category.name }}</h1>
        <div class="text-muted small">Category details</div>
    </div>

    <a href="{{ url_for('categories.index') }}"
       class="btn btn-outline-secondary">
        Back
    </a>

</div>

<div class="card shadow-sm">
    <div class="card-body">

        <div class="row g-4">

            <div class="col-12">
                <div class="text-muted small mb-1">
                    Description
                </div>

                <div>
                    {{ category.description or 'No description.' }}
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="text-muted small mb-1">
                    Status
                </div>

                {% if category.active %}
                    <span class="badge bg-success">
                        Active
                    </span>
                {% else %}
                    <span class="badge bg-secondary">
                        Inactive
                    </span>
                {% endif %}
            </div>

        </div>

    </div>
</div>

<div class="mt-4 d-flex gap-2">

    <a href="{{ url_for('categories.edit', category_id=category.id) }}"
       class="btn btn-primary">
        Edit
    </a>

    <form action="{{ url_for('categories.delete', category_id=category.id) }}"
          method="POST">

        <button type="submit"
                class="btn btn-outline-danger"
                onclick="return confirm('Delete {{ category.name }}?')">
            Delete
        </button>

    </form>

</div>

{% endblock %}
