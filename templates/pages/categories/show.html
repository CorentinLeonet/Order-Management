{% extends "base.html" %}
{% block title %}{{ category.name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">{{ category.name }}</h1>
    <a href="{{ url_for('categories.index') }}" class="btn btn-outline-secondary">Back</a>
</div>

<div class="card">
    <div class="card-body">
        <p class="text-muted mb-1">Description</p>
        <p>{{ category.description or 'No description.' }}</p>
    </div>
</div>

<div class="mt-3 d-flex gap-2">
    <a href="{{ url_for('categories.edit', category_id=category.id) }}" class="btn btn-primary">Edit</a>
    <form action="{{ url_for('categories.delete', category_id=category.id) }}" method="POST">
        <button type="submit" class="btn btn-outline-danger"
            onclick="return confirm('Delete {{ category.name }}?')">Delete</button>
    </form>
</div>
{% endblock %}
