{% extends "base.html" %}
{% block title %}Edit {{ category.name }}{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h1 class="mb-0">Edit {{ category.name }}</h1>
        <div class="text-muted small">Update category information</div>
    </div>

    <a href="{{ url_for('categories.show', category_id=category.id) }}"
       class="btn btn-outline-secondary">
        Back
    </a>

</div>

<div class="d-flex justify-content-center">

    <form action="{{ url_for('categories.update', category_id=category.id) }}"
          method="POST"
          class="w-100"
          style="max-width: 700px;">

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="row g-3">

                    <div class="col-12">
                        <label class="form-label text-muted small">Name</label>
                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ category.name }}"
                               required>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-muted small">Description</label>
                        <textarea name="description"
                                  class="form-control"
                                  rows="4">{{ category.description }}</textarea>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="active"
                                   id="active"
                                   {% if category.active %}checked{% endif %}>

                            <label class="form-check-label" for="active">
                                Active
                            </label>
                        </div>
                    </div>

                </div>

            </div>
        </div>

        <div class="mt-4 d-flex gap-2">

            <button type="submit" class="btn btn-primary">
                Save changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
