{% macro create_column_chart(chart_id, chart_title, legend, rows) %}
<script type="text/javascript">
  // Load the Visualization API and the corechart package.
  google.charts.load('current', {'packages':['corechart']});

  // Set a callback to run when the Google Visualization API is loaded.
  google.charts.setOnLoadCallback(drawChart);

  // Callback that creates and populates a data table,
  // instantiates the pie chart, passes in the data and
  // draws it.
  function drawChart() {
    
      // Create the data table.
      var data = new google.visualization.DataTable();
      data.addColumn('string', 'Topping');
        data.addColumn('number', '{{legend}}');
      array = []
      {% if rows %}
        {% for row in rows %}
          array.push([ "{{row[0]}}", {{row[1]}} ])
        {% endfor %}
      {% endif %}
      data.addRows(array)
      // Set chart options
      var options = {
                      title:"{{chart_title}}",
                      width:"100%",
                      height: "100%",
                      sliceVisibilityThreshold:0,
                      bar: {groupWidth: "relative"},
                      legend: { position: "none" },
                      chartArea: {
                        left: 50,
                        top: 50,
                        width: "85%",
                        height: "70%"
                      },
                      animation: {
                        startup : true,
                        duration: 1000,
                        easing : "Out"
                      } 
                    };
      // Instantiate and draw our chart, passing in some options.
      var chart = new google.visualization.ColumnChart(document.getElementById("{{chart_id}}"));
      chart.draw(data, options);
  }
</script>
{% endmacro %}
